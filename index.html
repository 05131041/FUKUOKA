        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            user-select: none;
            touch-action: manipulation;
            background-color: #F9F7F2;
            color: #363128;
        }

        /* 電腦版微型滾動條 */
        .custom-scroll::-webkit-scrollbar {
            height: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #EEE8DA;
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #ADC0A3;
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #738C67;
        }
        .custom-scroll {
            scrollbar-width: thin;
            scrollbar-color: #ADC0A3 #EEE8DA;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .custom-div-icon {
            background: transparent;
            border: none;
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1rem);
        }

            border: 1px solid #EEE8DA;
        }

        .leaflet-container {
            background-color: #f4f2eb !important;
        }

        .paper-texture {
            background-color: #F9F7F2;
            background-image: radial-gradient(#E0D6C2 0.75px, transparent 0.75px);

</head>
<body class="h-full flex flex-col text-beige-900 paper-texture overflow-x-hidden">

            <div class="flex items-center space-x-2.5">

                </div>
                <div>

                    <p class="text-[11px] text-beige-800/70">散步美食 · 景點與點心地圖導航</p>
                </div>
            </div>
            
            <div class="hidden sm:flex items-center space-x-2 text-xs text-sage-700 font-medium bg-sage-50 px-3 py-1.5 rounded-xl border border-sage-200">
                <span class="inline-block w-2 h-2 rounded-full bg-sage-500 animate-pulse"></span>
                <span>8日行程離線隨身版</span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->

        <!-- Left Pane: Itinerary Controls & Cards List -->

            <!-- Sticky Filter Header -->
            <div class="p-2.5 sm:p-3 bg-beige-50/80 backdrop-blur border-b border-beige-200/80 space-y-2 shrink-0">
                
                <!-- Search Box -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-beige-400 text-xs"></i>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜尋景點、店家、備註..." 
                        class="w-full pl-8 pr-8 py-1.5 bg-white border border-beige-200 rounded-xl text-xs outline-none focus:border-sage-500 focus:ring-1 focus:ring-sage-500 transition placeholder:text-beige-300">
                    <button id="search-clear-btn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-beige-400 hover:text-beige-800">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>

                    <button onclick="filterDay(2)" class="day-btn snap-start px-3 py-1.5 rounded-xl bg-white text-beige-800 hover:bg-beige-100 border border-beige-200 whitespace-nowrap transition active:scale-95 shrink-0" data-day="2">D2 天神</button>
                    <button onclick="filterDay(3)" class="day-btn snap-start px-3 py-1.5 rounded-xl bg-white text-beige-800 hover:bg-beige-100 border border-beige-200 whitespace-nowrap transition active:scale-95 shrink-0" data-day="3">D3 糸島海岸</button>
                    <button onclick="filterDay(4)" class="day-btn snap-start px-3 py-1.5 rounded-xl bg-white text-beige-800 hover:bg-beige-100 border border-beige-200 whitespace-nowrap transition active:scale-95 shrink-0" data-day="4">D4 由布院溫泉</button>
                    <button onclick="filterDay(5)" class="day-btn snap-start px-3 py-1.5 rounded-xl bg-white text-beige-800 hover:bg-beige-100 border border-beige-200 whitespace-nowrap transition active:scale-95 shrink-0" data-day="5">D5 由布院/博多</button>

            { id: '70', day: 6, time: '17:00', title: 'Gyorantei Uomachi ぎょらん亭 魚町店', category: '美食', gmap: 'https://maps.app.goo.gl/s3Dgj3EruKh7bb198', lat: 33.8814, lng: 130.8806, desc: '營業時間:11:00～00:00', price: '' },
            { id: '72', day: 6, time: '14:30', title: '門司港復古咖啡廳甜點 / 香蕉燒', category: '甜點', gmap: '', lat: 33.9455, lng: 130.9625, desc: '', price: '' },
            { id: '73', day: 6, time: '16:00', title: '小倉車站名物白頭翁可頌', category: '甜點', gmap: '', lat: 33.8863, lng: 130.8816, desc: '', price: '' },
            { id: '41', day: 6, time: '14:00', title: '藍翼橋', category: '', gmap: 'https://maps.app.goo.gl/v9yqZhEm7UbNiUE97', lat: 33.9481, lng: 130.9628, desc: '第1場：開橋 10:00 ／ 閉橋 10:20 第2場：開橋 11:00 ／ 閉橋 11:20 第3場：開橋 13:00 ／ 閉橋 13:20 第4場：開橋 14:00 ／ 閉橋 14:20 第5場：開橋 15:00 ／ 閉橋 15:20 第6場：開橋 16:00 ／ 閉橋 16:20', price: '' },
            { id: '85', day: 6, time: '08:00', title: '博多站 ➔ 門司港站', category: '交通', gmap: 'https://maps.app.goo.gl/nTzjMTZtudop5rjk6', lat: 33.945, lng: 130.96139, desc: '博多搭乘特急 Sonic / 新幹線至小倉，轉乘 JR 鹿兒島本線抵達「門司港站」', price: '' },
            { id: '86', day: 6, time: '09:00', title: '門司港棧橋 ➔ 關門連絡船➔ 抵達唐戶市場', category: '交通', gmap: 'https://maps.app.goo.gl/gUxN6RonF6ZAPzjV9', lat: 33.945939, lng: 130.960742, desc: '單程航行時間僅需 5 至 6 分鐘 頻率：大約每 20 分鐘一班', price: '單程票價¥400' },            
	    
	    // Day 7: 太宰府
            { id: '74', day: 7, time: '09:30', title: '太宰府天滿宮', category: '景點', gmap: 'https://maps.app.goo.gl/1LWNwZk1AJszZSP99', lat: 33.5215, lng: 130.5348, desc: '營業時間:06:00～19:30', price: '' },
            { id: '75', day: 7, time: '14:00', title: '寶滿宮竈門神社', category: '景點', gmap: '', lat: 33.5289, lng: 130.5524, desc: '絕美紅葉名所', price: '' },
            { id: '76', day: 7, time: '15:30', title: '九州國立博物館', category: '景點', gmap: '', lat: 33.5186, lng: 130.5386, desc: '', price: '' },
            { id: '77', day: 7, time: '11:30', title: '一蘭拉麵 太宰府參道店', category: '美食', gmap: 'https://maps.app.goo.gl/hUgjii7vjr332Yvb9', lat: 33.5189698, lng: 130.5325585, desc: '五角形碗合格拉麵 營業時間:09:00–19:00', price: '' },
            { id: '78', day: 7, time: '12:30', title: '味之明太子 fukuya', category: '美食', gmap: 'https://maps.app.goo.gl/1sbvs9yp2jhvrZqQA', lat: 33.5196346, lng: 130.5330547, desc: 'ふくや太宰府店 (明太子茶漬飯) 營業時間:09:30–17:30', price: '' },
            { id: '79', day: 7, time: '13:00', title: '漢堡 筑紫庵本店', category: '甜點', gmap: 'https://maps.app.goo.gl/wH4HgYe2iznvsJkPA', lat: 33.5197076, lng: 130.53239, desc: '太宰府漢堡 (太宰府バーガー)。內餡為現炸香酥多汁的唐揚雞，搭配太宰府在地特產「酸甜梅子醬」 營業時間:10:30–18:00', price: '' },
            { id: '80', day: 7, time: '10:30', title: '草莓最中·大福 天山 本店', category: '甜點', gmap: 'https://maps.app.goo.gl/FtH9Q9BP6F4e2AQd7', lat: 33.5864, lng: 130.3778, desc: '甘王草莓大福串 營業時間:10:00–17:00', price: '' },
            { id: '81', day: 7, time: '11:00', title: '梅枝餅', category: '甜點', gmap: '', lat: 33.5211, lng: 130.533, desc: 'かさの家 / やす武', price: '' },
            { id: '82', day: 7, time: '15:00', title: '福太郎 太宰府店', category: '甜點', gmap: 'https://maps.app.goo.gl/9b9BL9mThPoJcqQ67', lat: 33.5196216, lng: 130.5307538, desc: 'Fukutaro (明太子烤飯糰) 營業時間:09:00–17:00', price: '' },
            { id: '71', day: 7, time: '', title: '隈研吾星巴克', category: '甜點', gmap: 'https://maps.app.goo.gl/4CkxRGLSdFfvjKHY9', lat: 33.5196381, lng: 130.5334015, desc: '營業時間:08:00–20:00', price: '' },

            // Day 8: 柳橋連合市場
            { id: '83', day: 8, time: '09:00', title: '柳橋連合市場', category: '景點', gmap: '', lat: 33.5833, lng: 130.4078, desc: '博多人的廚房 博多車站伴手禮街 博多阪急百貨', price: '' },
            { id: '84', day: 8, time: '09:30', title: '柳橋連合市場：柳橋食堂 / まぐろ本舗', category: '美食', gmap: '', lat: 33.5833, lng: 130.4078, desc: '高 CP 值現切海鮮丼', price: '' }
        ];

        // Global State Variables
        let activeDay = 'all';
        let activeCategory = 'all';
        let searchQuery = '';
        let map;
        let markers = [];

        // Category Configurations
        const categoryConfig = {
            '景點': { bg: 'bg-[#EBF0E8]', text: 'text-[#5A704F]', border: 'border-[#CDD7C6]', icon: 'fa-leaf', color: '#738C67' },
            '美食': { bg: 'bg-[#F8EFEA]', text: 'text-[#C27355]', border: 'border-[#F0D8CD]', icon: 'fa-utensils', color: '#C27355' },
            '甜點': { bg: 'bg-[#F7EEF0]', text: 'text-[#BA7B88]', border: 'border-[#EBD6DC]', icon: 'fa-cookie-bite', color: '#BA7B88' },
            '購物': { bg: 'bg-[#F8F3EA]', text: 'text-[#B88F51]', border: 'border-[#EFE2CD]', icon: 'fa-bag-shopping', color: '#B88F51' },
            '交通': { bg: 'bg-[#EBF2F0]', text: 'text-[#627D75]', border: 'border-[#CCDCD7]', icon: 'fa-bus', color: '#627D75' }
        };

        function enableWheelHorizontalScroll() {
            const containers = document.querySelectorAll('.custom-scroll');
            containers.forEach(container => {
                container.addEventListener('wheel', (e) => {
                    if (e.deltaY !== 0) {
                        e.preventDefault();
                        container.scrollLeft += e.deltaY;
                    }
                }, { passive: false });
            });
        }

        function initMap() {
            map = L.map('map', {
                zoomControl: true,
                scrollWheelZoom: true
            }).setView([33.5902, 130.4207], 11);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap & CartoDB',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            renderListAndMap();
            enableWheelHorizontalScroll();
        }

        function createCustomPin(color) {
            const svgPin = `
                <div style="filter: drop-shadow(0px 3px 5px rgba(54,49,40,0.25));">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${color}" width="30" height="30">
                        <path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 00-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 002.682 2.282 16.975 16.975 0 001.145.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                    </svg>
                </div>`;
            return L.divIcon({
                html: svgPin,
                className: 'custom-div-icon',
                iconSize: [30, 30],
                iconAnchor: [15, 30],
                popupAnchor: [0, -28]
            });
        }

        function renderListAndMap() {
            const listContainer = document.getElementById('itinerary-list');
            listContainer.innerHTML = '';

            markers.forEach(m => map.removeLayer(m));
            markers = [];

            const filtered = itineraryItems.filter(item => {
                const matchDay = (activeDay === 'all') || (item.day == activeDay);
                const matchCat = (activeCategory === 'all') || (item.category === activeCategory);
                const matchQuery = !searchQuery || 
                    (item.title && item.title.toLowerCase().includes(searchQuery.toLowerCase())) ||
                    (item.desc && item.desc.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchDay && matchCat && matchQuery;
            });

            document.getElementById('item-count').textContent = filtered.length;

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-12 text-beige-400">
                        <i class="fa-solid fa-compass text-3xl mb-2 text-beige-300"></i>
                        <p class="text-xs">沒有找到符合條件的地點</p>
                    </div>`;
                return;
            }

            const bounds = [];

            filtered.forEach(item => {
                const catInfo = categoryConfig[item.category] || categoryConfig['景點'];

                const card = document.createElement('div');
                card.className = `p-3 rounded-2xl border ${catInfo.border} bg-white shadow-xs hover:shadow-md transition-all duration-200 active:scale-[0.99] cursor-pointer flex flex-col space-y-1.5 group`;
                card.onclick = () => focusLocation(item.lat, item.lng, item.id);

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-1.5">
                            <span class="text-[10px] px-2 py-0.5 rounded-md ${catInfo.bg} ${catInfo.text} font-medium flex items-center">
                                <i class="fa-solid ${catInfo.icon} mr-1 text-[9px]"></i>${item.category}
                            </span>
                            <span class="text-[10px] font-medium text-beige-800/70 bg-beige-100 px-1.5 py-0.5 rounded-md">
                                Day ${item.day} · ${item.time || '時間未定'}
                            </span>
                        </div>
                    </div>

                    <div>
                        <h3 class="font-serif font-bold text-beige-900 text-sm group-hover:text-sage-700 transition-colors">
                            ${item.title}
                        </h3>
                        ${item.desc ? `<p class="text-xs text-beige-800/70 mt-0.5 line-clamp-2 leading-relaxed">${item.desc}</p>` : ''}
                    </div>

                    <div class="flex items-center justify-between pt-1 border-t border-beige-100 text-xs">
                        <span class="text-[11px] text-beige-800/60 font-medium">${item.price ? `<i class="fa-regular fa-money-bill-1 mr-1"></i>${item.price}` : ''}</span>
                        <a href="${item.gmap}" target="_blank" onclick="event.stopPropagation()" class="inline-flex items-center space-x-1 text-[11px] text-sage-700 font-semibold bg-sage-50 hover:bg-sage-100 px-2.5 py-1 rounded-lg transition-colors border border-sage-200/50">
                            <i class="fa-solid fa-location-arrow text-[10px]"></i>
                            <span>Google 地圖導航</span>
                        </a>
                    </div>
                `;

                listContainer.appendChild(card);

                if (item.lat && item.lng) {
                    const markerPin = createCustomPin(catInfo.color);
                    const marker = L.marker([item.lat, item.lng], { icon: markerPin }).addTo(map);

                    // 這裡更新了彈出視窗導航按鈕的顏色與對比度
                    const popupContent = `
                        <div class="p-2 max-w-[220px]">
                            <div class="flex items-center space-x-1 mb-1">
                                <span class="text-[9px] px-1.5 py-0.5 rounded ${catInfo.bg} ${catInfo.text} font-medium">D${item.day} ${item.category}</span>
                                <span class="text-[10px] font-medium text-beige-800/70">${item.time || ''}</span>
                            </div>
                            <h4 class="font-serif font-bold text-xs text-beige-900">${item.title}</h4>
                            <p class="text-[11px] text-beige-800/70 my-1 line-clamp-2">${item.desc || ''}</p>
                            <a href="${item.gmap}" target="_blank" class="mt-2 inline-block w-full text-center bg-sage-50 hover:bg-sage-100 text-sage-800 border border-sage-300/80 text-xs font-semibold py-1.5 px-3 rounded-xl transition shadow-xs">
                                <i class="fa-solid fa-map-location-dot mr-1"></i>開 Google 地圖導航
                            </a>
                        </div>
                    `;

                    marker.bindPopup(popupContent);
                    marker.itemId = item.id;
                    markers.push(marker);
                    bounds.push([item.lat, item.lng]);
                }
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [25, 25], maxZoom: 14 });
            }
        }

        function filterDay(day) {
            activeDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => {
                if (btn.dataset.day == day) {
                    btn.className = 'day-btn snap-start px-3 py-1.5 rounded-xl bg-sage-600 text-white font-medium whitespace-nowrap shadow-xs transition active:scale-95 shrink-0';
                } else {
                    btn.className = 'day-btn snap-start px-3 py-1.5 rounded-xl bg-white text-beige-800 hover:bg-beige-100 border border-beige-200 whitespace-nowrap transition active:scale-95 shrink-0';
                }
            });
            renderListAndMap();
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat == cat) {
                    btn.classList.add('ring-2', 'ring-sage-500', 'font-semibold');
                } else {
                    btn.classList.remove('ring-2', 'ring-sage-500', 'font-semibold');
                }
            });
            renderListAndMap();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.trim();
            const clearBtn = document.getElementById('search-clear-btn');
            if (searchQuery) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderListAndMap();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            handleSearch();
        }

        function focusLocation(lat, lng, itemId) {
            if (window.innerWidth < 768) {
                switchMobileTab('map');
            }
            if (lat && lng) {
                setTimeout(() => {
                    map.flyTo([lat, lng], 15, { duration: 1 });
                    const marker = markers.find(m => m.itemId === itemId);
                    if (marker) {
                        marker.openPopup();
                    }
                }, 100);
            }
        }

        function resetMapView() {
            renderListAndMap();
        }

        function switchMobileTab(tab) {
            const listPane = document.getElementById('list-pane');
            const mapPane = document.getElementById('map-pane');
            const navBtnList = document.getElementById('nav-btn-list');
            const navBtnMap = document.getElementById('nav-btn-map');

            if (tab === 'list') {
                listPane.classList.remove('hidden');
                mapPane.classList.add('hidden');
                navBtnList.className = 'flex flex-col items-center justify-center w-24 py-1 text-sage-700 font-bold transition active:scale-95';
                navBtnMap.className = 'flex flex-col items-center justify-center w-24 py-1 text-beige-400 font-medium transition active:scale-95';
            } else {
                listPane.classList.add('hidden');
                mapPane.classList.remove('hidden');
                mapPane.classList.add('flex');
                navBtnList.className = 'flex flex-col items-center justify-center w-24 py-1 text-beige-400 font-medium transition active:scale-95';
                navBtnMap.className = 'flex flex-col items-center justify-center w-24 py-1 text-sage-700 font-bold transition active:scale-95';
                setTimeout(() => map.invalidateSize(), 200);
            }
        }

        window.onload = function () {
            initMap();
        };
    </script>
</body>
</html>
